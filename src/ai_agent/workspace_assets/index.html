<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="workspace-token" content="__WORKSPACE_TOKEN__">
  <title>学习工作区</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/markdown-it-15.0.3.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="layout">
    <nav class="rail" aria-label="工作区导航">
      <div class="brand"><span class="brand-mark" aria-hidden="true">学</span><div>研习台<small>你的本地学习工作区</small></div></div>
      <button class="nav-button" id="open-search" type="button" aria-haspopup="dialog"><span class="nav-icon" aria-hidden="true">⌕</span>搜索记录 <kbd>Ctrl K</kbd></button>
      <section class="conversations-nav" aria-label="对话历史">
        <div class="conversation-heading"><span>对话历史</span><button id="new-conversation" type="button" aria-label="新建对话" title="新建对话">＋</button></div>
        <div id="conversation-list"></div>
      </section>
      <div class="local-label">● 本地 SQLite</div>
    </nav>
    <main class="conversation">
      <header class="main-header"><div><span class="eyebrow">研习台 / 工作区</span><h1 id="chat-title">学习对话</h1><p id="view-caption">提问、核对资料，或讨论你的学习安排。</p></div><button id="refresh" type="button"><span aria-hidden="true">↻</span>刷新状态</button></header>
      <nav class="conversation-tabs" aria-label="当前对话的视图">
        <button class="active" type="button" data-view="all" aria-pressed="true">学习对话</button>
        <button type="button" data-view="plans" aria-pressed="false">计划候选 <span id="nav-pending"></span></button>
        <button type="button" data-view="tasks" aria-pressed="false">任务与反馈</button>
      </nav>
      <div id="notice-bar" hidden><div id="notice" role="status" aria-live="polite"></div><button id="dismiss-notice" type="button" aria-label="关闭通知">×</button></div>
      <div id="search-filter" hidden><span id="search-description" role="status"></span><button id="clear-search" type="button" class="text-action">清除筛选</button></div>
      <section id="timeline" aria-label="操作和对话结果"></section>
      <article id="pending-message" class="turn" hidden></article>
      <div id="stream-preview" class="stream-preview" hidden></div>
      <button id="jump-to-latest" class="text-action reply-jump" type="button" hidden>回到最新回复 ↓</button>
      <section class="composer card" aria-label="消息输入">
        <form id="chat-form">
          <label for="chat-input" class="visually-hidden">你的问题或调整建议</label>
          <textarea id="chat-input" required maxlength="12000" rows="1" placeholder="问一个问题，或讨论学习安排…"></textarea>
          <button type="submit" class="primary send-button" aria-label="发送消息" title="发送消息（Ctrl / ⌘ + Enter）"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        </form>
        <span class="muted" id="composer-status" role="status"></span>
      </section>
    </main>
    <aside class="inspector" aria-label="学习状态与功能" data-mobile-expanded="false">
      <header class="inspector-fixed">
        <div class="task-heading">
          <span class="section-label">学习进度</span>
          <button id="toggle-inspector" type="button" aria-controls="inspector-details" aria-expanded="false">计划与任务</button>
        </div>
        <progress id="progress" max="1" value="0" aria-label="已登记任务完成进度"></progress>
        <nav class="inspector-nav" aria-label="右栏模块">
        <button type="button" data-inspector-target="inspector-status">学习目标</button>
        <button type="button" data-inspector-target="inspector-plan">当前计划</button>
        <button type="button" data-inspector-target="inspector-tasks">计划任务</button>
        </nav>
      </header>
      <div class="inspector-scroll">
      <section id="inspector-status" class="card status-card" tabindex="-1">
        <div class="task-heading">
          <div class="section-label"><span class="status-dot"></span> 当前学习状态</div>
        </div>
        <h2 id="goal">正在加载…</h2>
        <p id="status"></p>
        <p id="review-note" class="muted"></p>
        <div class="materials-summary">
          <span id="materials-status" class="muted"></span>
          <button type="button" data-mode="bind_materials" class="text-action">本地资料</button>
        </div>
      </section>
      <div id="inspector-details">
      <section id="inspector-plan" class="card plan-card inspector-group" aria-labelledby="plan-title" tabindex="-1">
        <div class="section-label">正式安排</div>
        <h2 id="plan-title">当前计划</h2>
        <div id="plan-preview" class="plan-preview" aria-hidden="true" inert></div>
        <details id="plan-details"><summary>查看计划正文</summary><div id="formal-plan"></div></details>
        <div class="actions">
          <button type="button" id="export-plan" class="text-action">导出 Markdown</button>
          <button type="button" data-mode="adjust" class="text-action">调整计划</button>
          <button type="button" data-mode="replace" class="text-action">重新制定</button>
        </div>
      </section>
      <section id="inspector-tasks" class="card inspector-group" aria-labelledby="plan-tasks-title" tabindex="-1"><div class="section-label">任务进度</div><div class="task-heading"><h2 id="plan-tasks-title">当前计划任务</h2><button type="button" data-mode="extract_tasks" class="text-action">从计划提取</button></div>
        <div id="tasks"></div>
        <button type="button" data-mode="create_task" class="text-action">＋ 添加临时任务</button>
      </section>
      </div>
      </div>
    </aside>
  </div>
  <dialog id="editor" aria-labelledby="editor-title">
    <header class="dialog-header"><div><span class="eyebrow">工作区操作</span><h2 id="editor-title"></h2></div><button id="close-editor" type="button" aria-label="关闭弹窗" title="关闭弹窗">×</button></header>
    <div id="editor-body"></div>
    <div id="editor-notice" role="status" aria-live="polite"></div>
    <div id="editor-stream" class="stream-preview" hidden></div>
  </dialog>
  <dialog id="search-dialog" aria-labelledby="search-title">
    <header class="dialog-header"><h2 id="search-title">搜索工作区记录</h2><button id="close-search" class="dialog-close" type="button" aria-label="关闭搜索">×</button></header>
    <form id="search-form" role="search">
      <label for="timeline-search">搜索当前对话、计划候选和任务记录</label>
      <div class="search-row">
        <input type="search" id="timeline-search" placeholder="例如：阅读计划" autocomplete="off" required>
        <button type="submit" class="primary">搜索</button>
      </div>
    </form>
  </dialog>
</body>
</html>
