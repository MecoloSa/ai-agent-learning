[project]
name = "ai-agent"
version = "0.1.0"
description = "Local learning-material analysis and study-plan agent"
readme = "src/ai_agent/README.md"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4,<5",
    "dashscope>=1.27.4",
    "get-settings>=0.1.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.29,<2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite==3.1.1",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pypdf>=6.18.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "tenacity>=9.1.4",
]

[project.scripts]
learning-agent = "ai_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
